tunnel: local-stream-server
# credentials-file: Replace with your actual path, e.g.:
#   Windows: C:\Users\<YourName>\.cloudflared\<tunnel-id>.json
#   Linux/Mac: /home/<user>/.cloudflared/<tunnel-id>.json
# Run `setup-tunnel.bat` to generate this file automatically.

# Ingress rules - order matters!
ingress:
  # Web interface - accessible via HTTPS
  - hostname: stream.your-domain.com
    service: http://localhost:9000
    originRequest:
      noTLSVerify: true

  # RTMP server - accessible via TCP for OBS
  - hostname: rtmp.your-domain.com
    service: tcp://localhost:2935

  # HLS / media server (port 9081)
  - hostname: media.your-domain.com
    service: http://localhost:9081
    originRequest:
      noTLSVerify: true

  # Go media server — WebSocket MSE & WebRTC (port 9084)
  - hostname: ws.your-domain.com
    service: http://localhost:9084
    originRequest:
      noTLSVerify: true

  # Catch-all rule (required by cloudflared)
  - service: http_status:404

# Optional: Logging configuration
# loglevel: info
# logfile: cloudflared.log
